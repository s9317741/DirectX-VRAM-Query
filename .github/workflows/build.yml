name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-directx:
    name: DirectX (DX9 / DX11 / DX12)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build DX9
        run: cmake --build build --config Release --target vram_dx9

      - name: Build DX11
        run: cmake --build build --config Release --target vram_dx11

      - name: Build DX12
        run: cmake --build build --config Release --target vram_dx12

  build-vulkan:
    name: Vulkan
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        run: |
          $tag = (Invoke-RestMethod "https://api.github.com/repos/KhronosGroup/Vulkan-Headers/releases/latest").tag_name
          $version = $tag.TrimStart('v')
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Output "Downloading Vulkan SDK $version"
          Invoke-WebRequest $url -OutFile VulkanSDK.exe
          Start-Process VulkanSDK.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = "C:\VulkanSDK\$version"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:VULKAN_SDK"

      - name: Build Vulkan
        run: cmake --build build --config Release --target vram_vulkan

  build-opencl:
    name: OpenCL
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCL SDK
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/KhronosGroup/OpenCL-SDK/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*Win-x64.zip" } | Select-Object -First 1
          Write-Output "Downloading $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile opencl-sdk.zip
          Expand-Archive opencl-sdk.zip -DestinationPath opencl-sdk
          $sdkDir = (Get-ChildItem opencl-sdk -Directory | Select-Object -First 1).FullName
          echo "CMAKE_PREFIX_PATH=$sdkDir" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Build OpenCL
        run: cmake --build build --config Release --target vram_opencl
