name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-directx:
    name: DirectX (DX9 / DX11 / DX12)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DX9
        run: cmake --build build --target vram_dx9

      - name: Build DX11
        run: cmake --build build --target vram_dx11

      - name: Build DX12
        run: cmake --build build --target vram_dx12

  build-vulkan:
    name: Vulkan
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.5.3
        with:
          vulkan_version: 1.4.350.0
          install_runtime: true
          cache: true

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Vulkan
        run: cmake --build build --target vram_vulkan

  build-opencl:
    name: OpenCL
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenCL SDK
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/KhronosGroup/OpenCL-SDK/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*Win-x64.zip" } | Select-Object -First 1
          Write-Output "Downloading $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile opencl-sdk.zip
          Expand-Archive opencl-sdk.zip -DestinationPath opencl-sdk
          $sdkDir = (Get-ChildItem opencl-sdk -Directory | Select-Object -First 1).FullName
          echo "CMAKE_PREFIX_PATH=$sdkDir" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Build OpenCL
        run: cmake --build build --target vram_opencl
